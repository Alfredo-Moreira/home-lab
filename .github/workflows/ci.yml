# CI for the homelab site: formatting, the server, the client, the compose
# files and scripts, and end-to-end tests against the demo stack (fake data,
# no NAS). The e2e job builds the production image, boots it read-only like
# the NAS does, and checks the image itself.
# Every job is read-only towards the repo; nothing is deployed from here: the
# registry and the NAS live on the home LAN (see scripts/build-and-push.sh).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check

  server:
    name: Server (typecheck, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and HTTP tests (config, sanitisers, uptime maths, security headers, rate limit)
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (runtime, high and critical)
        run: npm audit --omit=dev --audit-level=high

  client:
    name: Client (lint, typecheck, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint (ESLint, react-hooks)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests (Vitest + Testing Library)
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (runtime, high and critical)
        run: npm audit --omit=dev --audit-level=high

  compose-and-scripts:
    name: Compose files and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose files are valid
        run: |
          for f in docker-compose.yml docker-compose.demo.yml docker-compose.nas.yml; do
            echo "== $f"; docker compose -f "$f" config --quiet
          done
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Demo config and example config agree on the public sections
        run: |
          node -e "
            const fs = require('fs');
            const pick = (f) => fs.readFileSync(f, 'utf8').split(/^services:/m)[0].split(/^site:/m)[1];
            if (pick('config/homelab.example.yaml') !== pick('config/homelab.demo.yaml')) {
              console.error('::error::site/hardware/stack differ between example and demo configs'); process.exit(1);
            }"

  e2e:
    name: End-to-end (Playwright + axe, demo stack)
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: docker/setup-buildx-action@v4
      - name: Start the demo stack (mock NAS, seeded history; app runs read-only)
        run: docker compose -f docker-compose.demo.yml up -d --build --wait
      - name: Image runs as a non-root user
        run: |
          uid=$(docker compose -f docker-compose.demo.yml exec -T homelab id -u)
          if [ "$uid" = "0" ]; then echo "::error::image runs as root"; exit 1; fi
      - name: No real config baked into the image (it holds internal hostnames)
        run: |
          image=$(docker compose -f docker-compose.demo.yml images homelab --format json | jq -r '.[0] | "\(.Repository):\(.Tag)"')
          if docker run --rm --entrypoint sh "$image" -c 'test -e /app/config/homelab.yaml'; then
            echo "::error::config/homelab.yaml is inside the image"; exit 1
          fi
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Typecheck tests
        working-directory: e2e
        run: npx tsc --noEmit
      - name: Run (desktop + mobile; pages, accessibility, API leak checks, headers)
        working-directory: e2e
        run: npm test
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
