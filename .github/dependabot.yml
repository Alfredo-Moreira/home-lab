# Dependabot version updates. Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/", "/server", "/client", "/e2e"]
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: build
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "area: docker"]
    commit-message:
      prefix: build
