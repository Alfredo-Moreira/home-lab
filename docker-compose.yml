## LOCAL DEVELOPMENT: the full stack, including the metrics sidecars.
## On Docker Desktop, Glances and Docker report on the Docker VM, not your Mac.
services:
  mongo:
    image: mongo:7
    container_name: homelab-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  glances:
    image: nicolargo/glances:latest
    container_name: homelab-glances
    restart: unless-stopped
    pid: host
    environment:
      - GLANCES_OPT=-w --disable-webui

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homelab-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1 # GET /containers only; every other endpoint and all POSTs are denied
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  homelab:
    build: .
    container_name: homelab-local
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/homelab
      - GLANCES_URL=http://glances:61208
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - mongo
      - glances
      - docker-socket-proxy

volumes:
  mongo-data:
