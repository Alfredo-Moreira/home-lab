# Homelab site config. Copy to config/homelab.yaml (gitignored) and edit.
#
# PUBLIC vs PRIVATE fields
#   Everything under site, hardware, stack, and each service's name,
#   description, category, visibility and url is shown to every visitor.
#   A service's `check` block and the nas/docker endpoints stay on the server.
#   Never put internal IPs or hostnames in a public field.

site:
  title: homelab
  tagline: A 4-bay ARM NAS running my apps, my house, and my experiments. Shipped like prod.
  owner:
    name: Alfredo Moreira
    handle: alfredo
    role: Software engineer
    # location: City, ST
    bio: >-
      I build software for a living and run a small homelab for fun. This box
      hosts the apps I write, the automations that run my house, and whatever
      I'm learning this month. Everything is containerized, versioned and
      deployed with the same care I'd give a production system.
  links:
    - { label: Portfolio, url: "https://alfredomoreira.dev", kind: portfolio }
    - { label: GitHub, url: "https://github.com/Alfredo-Moreira", kind: github }
    - { label: LinkedIn, url: "https://www.linkedin.com/in/alfredomoreira/", kind: linkedin }
    - { label: Instagram, url: "https://www.instagram.com/alfredo.r.moreira/", kind: instagram }

hardware:
  - group: Compute
    items:
      - name: UGREEN NASync DH4300 Plus
        detail: Rockchip RK3588C, 8-core ARM (4× A76 + 4× A55), 8 GB LPDDR4X, 32 GB eMMC for UGOS Pro
        why: Low idle power for an always-on box, and arm64 is a fun constraint, since every image I ship is built multi-arch.
  - group: Storage
    items:
      - name: 4 × SATA bays
        detail: 2.5"/3.5" drives, RAID 0/1/5/6/10 or JBOD, up to 128 TB raw # TODO: list your actual drives and RAID level
        why: Room to grow, plus redundancy so one dead drive is a shrug, not a weekend.
  - group: Network
    items:
      - name: 2.5 GbE
        detail: Single 2.5 GbE port, backwards compatible with 1 GbE
      - name: Cloudflare Tunnel
        detail: Outbound-only tunnel; no ports forwarded on the router
        why: The house has no open inbound ports. Public sites ride an outbound connection to Cloudflare's edge.
  - group: I/O
    items:
      - name: Ports
        detail: HDMI (4K), USB-C 3.2 Gen 1, 2 × USB-A 3.2 Gen 1

stack:
  - name: Docker
    role: Runtime for every service
    why: Every app is an image with a pinned version; rollback is changing a tag.
    href: https://www.docker.com
  - name: Cloudflare Tunnel
    role: Public ingress
    why: Exposes selected sites without opening ports, with Cloudflare TLS and DDoS protection in front.
    href: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
  - name: Zoraxy
    role: Reverse proxy
    why: One place to route hostnames to containers, for both tunnel traffic and LAN-only hosts.
    href: https://zoraxy.aroz.org
  - name: Home Assistant
    role: Home automation
    why: Local-first automations that keep working when the internet doesn't.
    href: https://www.home-assistant.io
  - name: MongoDB
    role: Shared database
    why: One instance on the bridge network serves the apps that need a document store.
    href: https://www.mongodb.com
  - name: Private registry
    role: Image storage
    why: Images are built multi-arch on my laptop and pulled by the NAS, so the NAS never builds.
  - name: Glances
    role: Metrics
    why: Lightweight system metrics over a REST API; it powers the live numbers on this page.
    href: https://nicolargo.github.io/glances/

services:
  # visibility: public   → reachable on the internet via the tunnel; `url` is shown
  # visibility: internal → LAN only; listed with status, never linked
  # check.url is server-side only: container names / LAN IPs are fine here.
  - id: homelab
    name: homelab
    description: This site. Live status for the box it runs on.
    category: dev
    visibility: public
    url: https://lab.moreiralabs.org
    check: { url: "http://localhost:3080/api/health" }

  - id: portfolio
    name: Portfolio
    description: My personal site, résumé and blog.
    category: apps
    visibility: public
    url: https://alfredomoreira.dev
    check: { url: "https://alfredomoreira.dev" }

  - id: analytics
    name: Analytics
    description: Self-hosted, privacy-friendly web analytics (Matomo).
    category: infra
    visibility: public
    url: https://analytics.moreiralabs.org
    check: { url: "https://analytics.moreiralabs.org" }

  - id: macroleaf
    name: MacroLeaf
    description: Meal planning and nutrition tracking app I built. React, Express, MongoDB.
    category: apps
    visibility: internal
    check: { url: "http://meal-prep-calculator:3001/api/health" }

  - id: home-assistant
    name: Home Assistant
    description: Automations, sensors and dashboards for the house.
    category: home
    visibility: internal
    check: { url: "http://192.168.4.79:8123/manifest.json" } # TODO: your HA address

  - id: zoraxy
    name: Zoraxy
    description: Reverse proxy that routes every hostname to its container.
    category: infra
    visibility: internal
    check: { url: "http://192.168.4.79:8000", expect: [200, 301, 302, 307, 401] } # TODO: admin port

  - id: registry
    name: Container registry
    description: Private Docker registry the NAS pulls every image from.
    category: dev
    visibility: internal
    check: { url: "http://192.168.4.79:5000/v2/" }

  - id: ugos
    name: UGOS Pro
    description: The NAS's own management UI.
    category: infra
    visibility: internal
    check: { url: "https://192.168.4.79:9443", insecureTls: true } # TODO: UGOS port

checks:
  intervalSeconds: 60
  retentionDays: 30

nas:
  # Usually set with the GLANCES_URL env var instead (see docker-compose.nas.yml).
  # glancesUrl: http://host.docker.internal:61208
  volumes:
    - { mount: /volume1, label: Volume 1 } # TODO: match your UGOS volumes
  # interface: eth0

docker:
  # Usually set with the DOCKER_PROXY_URL env var instead.
  # proxyUrl: http://docker-socket-proxy:2375
  hide: # the site's own sidecars
    - "*docker-proxy*"
    - "*glances*"
